[package]
name = "fmd-lua"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["xpath-native"]
# Builds the `fpc` XPath backend (needs `fpc`, see crates/xpath-fpc/README.md).
xpath-fpc = ["fmd-xpath/fpc"]
# Builds the pure-Rust `native` XPath backend.
xpath-native = ["fmd-xpath/native"]

[dependencies]
aes = "0.8"
chacha20 = "0.9"
fmd-http = { path = "../fmd-http" }
fmd-xpath = { path = "../fmd-xpath", default-features = false }
flate2 = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
md-5 = "0.10"
md4 = "0.10"
mlua.workspace = true
# Not used directly: depending on it hands build.rs the vendored Lua headers (DEP_LUA_INCLUDE).
mlua-sys = "0.13"
poly1305 = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rquickjs = "0.14"
sha1 = "0.10"
sha2 = "0.10"
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync"] }
tracing.workspace = true
x25519-dalek = "2"

[build-dependencies]
cc = "1"

[dev-dependencies]
fmd-duktape-ref = { path = "../fmd-duktape-ref" }
fmd-testkit = { path = "../fmd-testkit" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
tempfile.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }

[lints]
workspace = true

[[bench]]
name = "check_anti_bot"
harness = false
