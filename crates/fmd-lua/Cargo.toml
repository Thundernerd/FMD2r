[package]
name = "fmd-lua"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Installs `CreateTXQuery` over the `fpc` XPath backend (needs `fpc`, see crates/xpath-fpc/README.md).
xpath-fpc = ["fmd-xpath/fpc"]

[dependencies]
fmd-http = { path = "../fmd-http" }
fmd-xpath = { path = "../fmd-xpath" }
mlua.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_json = "1"
tempfile.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }

[lints]
workspace = true
