[package]
name = "fmd-lua"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
flate2 = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
mlua.workspace = true
# Not used directly: depending on it hands build.rs the vendored Lua headers (DEP_LUA_INCLUDE).
mlua-sys = "0.13"
thiserror.workspace = true
tracing = "0.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
tempfile.workspace = true
tracing = "0.1"
