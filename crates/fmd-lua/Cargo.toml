[package]
name = "fmd-lua"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Installs `CreateTXQuery` over the `fpc` XPath backend (needs `fpc`, see crates/xpath-fpc/README.md).
xpath-fpc = ["fmd-xpath/fpc"]

[dependencies]
aes = "0.8"
chacha20 = "0.9"
fmd-http = { path = "../fmd-http" }
fmd-xpath = { path = "../fmd-xpath" }
flate2 = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
md-5 = "0.10"
md4 = "0.10"
mlua.workspace = true
# Not used directly: depending on it hands build.rs the vendored Lua headers (DEP_LUA_INCLUDE).
mlua-sys = "0.13"
poly1305 = "0.8"
rquickjs = "0.14"
sha1 = "0.10"
sha2 = "0.10"
thiserror.workspace = true
tracing.workspace = true
x25519-dalek = "2"

[build-dependencies]
cc = "1"

[dev-dependencies]
fmd-testkit = { path = "../fmd-testkit" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
serde_json = "1"
tempfile.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }

[lints]
workspace = true
