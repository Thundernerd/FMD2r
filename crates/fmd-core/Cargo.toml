[package]
name = "fmd-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Hashes the server password (`server.auth_token`).
argon2 = { version = "0.5", features = ["std"] }
# RFC 2047 encoding of non-ASCII ntfy headers.
base64 = "0.22"
fmd-http = { path = "../fmd-http" }
fmd-lua = { path = "../fmd-lua", default-features = false }
fmd-pack = { path = "../fmd-pack" }
fmd-store = { path = "../fmd-store" }
# The download schedule's local time of day.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-always"] }
# Matching list titles against MangaBaka's database (T73).
regex = "1"
# Streams MangaBaka's dump (`series.jsonl.zst`) to disk instead of holding it in memory.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
# Extracts FMD2-DB dumps.
sevenz-rust = { version = "0.6", default-features = false }
tempfile.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true
unicode-normalization = "0.1"
utoipa = "5"
zstd = "0.13"

[target.'cfg(unix)'.dependencies]
# `statvfs`, for the free space on the disks downloads save to.
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
fmd-lua = { path = "../fmd-lua", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time"] }
tracing-subscriber.workspace = true
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true
