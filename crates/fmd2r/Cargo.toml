[package]
name = "fmd2r"
description = "FMD2r: self-hosted manga downloader running FMD2's Lua website modules"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Builds the `fpc` XPath backend too (needs `fpc`, see crates/xpath-fpc/README.md), for
# `xpath.backend = "fpc"`, `fmd2r xpath eval --backend fpc` and `fmd2r xpath diff`.
xpath-fpc = ["fmd-lua/xpath-fpc", "fmd-server/xpath-fpc", "fmd-xpath/fpc"]

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
fmd-http = { path = "../fmd-http" }
fmd-import = { path = "../fmd-import" }
fmd-lua = { path = "../fmd-lua" }
fmd-server = { path = "../fmd-server" }
fmd-store = { path = "../fmd-store" }
fmd-xpath = { path = "../fmd-xpath", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
assert_cmd.workspace = true
axum = "0.8"
brotli = "8"
flate2 = "1"
fmd-core = { path = "../fmd-core" }
fmd-smoke = { path = "../fmd-smoke" }
predicates.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
tempfile.workspace = true
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true
