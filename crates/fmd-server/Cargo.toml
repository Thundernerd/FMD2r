[package]
name = "fmd-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Builds the `fpc` XPath backend too (needs `fpc`, see crates/xpath-fpc/README.md), for
# `xpath.backend = "fpc"`.
xpath-fpc = ["fmd-lua/xpath-fpc"]

[dependencies]
axum = { version = "0.8", features = ["macros"] }
fmd-core = { path = "../fmd-core" }
fmd-http = { path = "../fmd-http" }
fmd-import = { path = "../fmd-import" }
fmd-lua = { path = "../fmd-lua" }
fmd-pack = { path = "../fmd-pack" }
fmd-store = { path = "../fmd-store" }
futures-util = "0.3"
getrandom = "0.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
mime_guess = "2"
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror.workspace = true
time = { version = "0.3", features = ["formatting"] }
tempfile.workspace = true
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
url = "2"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }

[lints]
workspace = true
