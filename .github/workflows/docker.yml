name: Docker

# Split from ci.yml so the image only builds when something it is built from changes: the
# Dockerfile's COPY sources (`COPY . .` takes the whole context, but only these reach the image),
# plus the files the job itself validates or runs.
on:
  push:
    branches: [main]
    paths: &paths
      - crates/**
      - web/**
      - openapi.json
      - fixtures/lua/**
      - docker/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - .env.example
      - scripts/docker-smoke.sh
      - .github/workflows/docker.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

# A new push to a PR cancels its running build; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # fmd2r cross-compiles for arm64; only the arm64 image's runtime stage and smoke test run under
  # QEMU.
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose.yaml
        if: matrix.arch == 'amd64'
        run: docker compose config -q && docker compose --env-file .env.example config -q
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'arm64'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: fmd2r:smoke
          build-args: FMD2R_GIT_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke test
        run: scripts/docker-smoke.sh fmd2r:smoke
