name: Smoke (nightly)

# Runs the smoke list (fixtures/smoke/list.toml) live and against its recorded fixtures. In the
# report, a failing replay is an FMD2r regression; failing only live means the site or upstream
# module changed.
#
# Entry failures don't fail the job (live sites break all the time; CI's replay gates merges), and
# the run steps continue on errors so the report is written from whatever results exist.
#
# Both runs record their XPath evaluations, which `fmd2r xpath diff` checks on the fpc and native
# backends: live pages catch differences the committed corpus misses. A mismatch fails the job.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: 0

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install FPC
        run: sudo apt-get update && sudo apt-get install -y fpc
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # fmd2r links libfmdxpath.so (the fpc backend) from the build directory, without an rpath.
      - name: Build
        run: |
          cargo build -p fmd2r -p fmd-smoke --features fmd2r/xpath-fpc
          echo "LD_LIBRARY_PATH=$(realpath "$(dirname "$(ls target/debug/build/xpath-fpc-*/out/libfmdxpath.so | head -n1)")")" >> "$GITHUB_ENV"
      # Modules that run node (utils.nodejs, e.g. comix) npm-install puppeteer in each run's
      # working directory; its browser download is a postinstall script npm may skip.
      - name: Install puppeteer's browser
        continue-on-error: true
        run: npx -y puppeteer browsers install
      - name: Replay
        continue-on-error: true
        run: target/debug/fmd-smoke run --xpath-corpus xpath-corpus --out smoke-replay.json
      - name: Live
        continue-on-error: true
        run: target/debug/fmd-smoke run --live --xpath-corpus xpath-corpus --out smoke-live.json
      - name: Report
        if: always()
        continue-on-error: true
        run: |
          target/debug/fmd-smoke report --live smoke-live.json --replay smoke-replay.json --out smoke-report.md
          cat smoke-report.md >> "$GITHUB_STEP_SUMMARY"
      # Fails the job on a mismatch, so a native/fpc difference on live pages is visible.
      - name: XPath differential
        if: always()
        run: |
          status=0
          target/debug/fmd2r xpath diff --corpus xpath-corpus --out xpath-diff.md || status=$?
          if [ -f xpath-diff.md ]; then head -c 60000 xpath-diff.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-report
          path: |
            smoke-report.md
            smoke-live.json
            smoke-replay.json
            xpath-diff.md
            xpath-corpus
          if-no-files-found: warn
