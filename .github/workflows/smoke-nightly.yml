name: Smoke (nightly)

# Runs the smoke list (fixtures/smoke/list.toml) against the live sites and against its recorded
# fixtures, and uploads a report that tells the two kinds of breakage apart: an entry whose replay
# fails is an FMD2r regression, one that fails only live had its site or upstream module change.
#
# Entry failures don't fail the job (`fmd-smoke run` exits 0 on them): live sites break all the
# time, and the smoke steps only report. The run steps also continue on errors, so the report is
# written from whatever results exist. It runs on a schedule, not on pushes or PRs, so it doesn't
# gate merges; CI's own replay (the `smoke` test run by `cargo test` in ci.yml) does.
#
# Both runs also record their XPath evaluations into a differential corpus, which `fmd2r xpath
# diff` then evaluates on the fpc and native backends: the live run brings today's pages, so this
# catches native/fpc differences the committed corpus (fixtures/xpath-corpus) doesn't have. A
# mismatch fails the job (after the report is written), unlike entry failures.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: 0

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FPC
        run: sudo apt-get update && sudo apt-get install -y fpc
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # fmd2r links libfmdxpath.so (the fpc backend) from the build directory, without an rpath.
      - name: Build
        run: |
          cargo build -p fmd2r -p fmd-smoke --features fmd2r/xpath-fpc
          echo "LD_LIBRARY_PATH=$(dirname "$(ls target/debug/build/xpath-fpc-*/out/libfmdxpath.so | head -n1)")" >> "$GITHUB_ENV"
      - name: Replay
        continue-on-error: true
        run: target/debug/fmd-smoke run --xpath-corpus xpath-corpus --out smoke-replay.json
      - name: Live
        continue-on-error: true
        run: target/debug/fmd-smoke run --live --xpath-corpus xpath-corpus --out smoke-live.json
      - name: Report
        if: always()
        continue-on-error: true
        run: |
          target/debug/fmd-smoke report --live smoke-live.json --replay smoke-replay.json --out smoke-report.md
          cat smoke-report.md >> "$GITHUB_STEP_SUMMARY"
      # Fails the job on a mismatch, so a native/fpc difference on live pages is visible.
      - name: XPath differential
        if: always()
        run: |
          status=0
          target/debug/fmd2r xpath diff --corpus xpath-corpus --out xpath-diff.md || status=$?
          if [ -f xpath-diff.md ]; then head -c 60000 xpath-diff.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: |
            smoke-report.md
            smoke-live.json
            smoke-replay.json
            xpath-diff.md
            xpath-corpus
          if-no-files-found: warn
