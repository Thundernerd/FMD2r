name: Release

# On a version tag: the multi-arch container image (linux/amd64 and linux/arm64, each smoke-tested,
# then pushed to GHCR) and a Linux tarball per architecture with the binary, attached to a GitHub
# release with SHA-256 checksums. fmd2r uses the native XPath backend only, so neither ships
# libfmdxpath.so. arm64 cross-compiles; only its smoke tests run under QEMU.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` (flavor latest=auto) follows non-prerelease tags.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # One image per platform, loaded and smoke-tested before anything is pushed.
      - name: Build (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: fmd2r:smoke-amd64
          build-args: FMD2R_GIT_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
      - name: Smoke test (amd64)
        run: scripts/docker-smoke.sh fmd2r:smoke-amd64
      - name: Build (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: fmd2r:smoke-arm64
          build-args: FMD2R_GIT_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
      - name: Smoke test (arm64, under QEMU)
        run: scripts/docker-smoke.sh fmd2r:smoke-arm64
      # Same inputs as the builds above, so every layer comes from the cache.
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: FMD2R_GIT_REVISION=${{ github.sha }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64

  # Built on the oldest supported Ubuntu runner, so the binaries need only glibc 2.35. The arm64
  # binary is cross-compiled and smoke-tested under QEMU.
  tarball:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - arch: x86_64
          - arch: aarch64
            cross: true
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-gnu
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web UI
        working-directory: web
        run: npm ci && npm run build
      - name: Install the cross toolchain and QEMU
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
      - run: rustup toolchain install && rustup target add "$TARGET"
      - name: Build fmd2r
        env:
          FMD2R_GIT_REVISION: ${{ github.sha }}
        run: cargo build --release --locked -p fmd2r --target "$TARGET"
      - name: Package
        run: |
          name=fmd2r-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux-gnu
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/fmd2r" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - name: Smoke test
        env:
          FMD2R_RUNNER: ${{ matrix.cross && 'qemu-aarch64 -L /usr/aarch64-linux-gnu' || '' }}
        run: scripts/tarball-smoke.sh dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [image, tarball]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Image: \`ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}\`"
