# On a version tag: the amd64/arm64 container image (smoke-tested, then pushed to GHCR) and a
# Linux tarball per architecture, attached to a GitHub release with SHA-256 checksums.
#
# The image follows Docker's pattern for distributing a multi-platform build across runners: each
# platform builds natively on its own runner (arm64 on ubuntu-24.04-arm, so no QEMU), is
# smoke-tested, and only then pushed to GHCR by digest, untagged. The `manifest` job runs once both
# platforms pass and tags the multi-platform manifest list built from those digests, so nothing gets
# a tag unless both platforms passed.
#
# PRs that change the release plumbing, and manual runs, are dry runs: both platforms build and are
# smoke-tested, but nothing is pushed or released.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/docker-smoke.sh
      - scripts/set-version.sh
      - scripts/tarball-smoke.sh
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The version every build reports, from the tag. Dry runs use a placeholder, so the stamping and
  # its smoke checks run on them too.
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-dryrun' }}

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Cargo.toml's version on main is not bumped per release: the tag sets it.
      - name: Set the version from the tag
        run: scripts/set-version.sh "$VERSION"
      # GHCR image names must be lowercase.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      # Docker Hub images come through Google's mirror: Docker Hub rate-limits (429) and often fails
      # (500) requests from GitHub's runners. BuildKit falls back to Docker Hub for anything the
      # mirror lacks.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v4
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The labels go on the per-platform image; the tags go on the manifest list (`manifest` job).
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      - name: Build (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: fmd2r:smoke-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: FMD2R_GIT_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke test (${{ matrix.arch }})
        run: FMD2R_EXPECT_VERSION="$VERSION" scripts/docker-smoke.sh fmd2r:smoke-${{ matrix.arch }}
      # Same inputs as the build above, so every layer comes from the cache.
      - name: Push by digest
        id: push
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: FMD2R_GIT_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export the digest
        if: github.ref_type == 'tag'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tags the multi-platform manifest list once both platforms passed their smoke tests.
  manifest:
    needs: image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        env:
          # Annotations for the manifest list (the index) that `imagetools create` writes.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          # `latest` (flavor latest=auto) follows non-prerelease tags.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done \
            < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r annotation; do args+=(--annotation "$annotation"); done \
            < <(jq -r '.annotations[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"
      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  # Built on the oldest supported Ubuntu runner, so the binaries need only glibc 2.35. The arm64
  # binary is cross-compiled and smoke-tested under QEMU.
  tarball:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - arch: x86_64
          - arch: aarch64
            cross: true
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-gnu
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
    steps:
      - uses: actions/checkout@v7
      # Cargo.toml's version on main is not bumped per release: the tag sets it.
      - name: Set the version from the tag
        run: scripts/set-version.sh "$VERSION"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web UI
        working-directory: web
        run: npm ci && npm run build
      - name: Install the cross toolchain and QEMU
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
      - run: rustup toolchain install && rustup target add "$TARGET"
      - name: Build fmd2r
        env:
          FMD2R_GIT_REVISION: ${{ github.sha }}
        run: cargo build --release --locked -p fmd2r --target "$TARGET"
      - name: Package
        run: |
          name=fmd2r-${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}-${{ matrix.arch }}-linux-gnu
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/fmd2r" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - name: Smoke test
        env:
          FMD2R_RUNNER: ${{ matrix.cross && 'qemu-aarch64 -L /usr/aarch64-linux-gnu' || '' }}
        run: FMD2R_EXPECT_VERSION="$VERSION" scripts/tarball-smoke.sh dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [manifest, tarball]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tarball-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Image: \`ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}\`"
