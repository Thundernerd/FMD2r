name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml, which installs the pinned toolchain with rustfmt and clippy.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # Prints how many upstream modules pass `Init` (the test itself fails on any failure).
      - name: Module corpus
        run: cargo test -p fmd-lua --test module_corpus -- --nocapture

  # crates/xpath-fpc is outside the root workspace: it needs fpc, which the check job doesn't install.
  xpath-fpc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/xpath-fpc
    steps:
      - uses: actions/checkout@v4
      - name: Install FPC
        run: sudo apt-get update && sudo apt-get install -y fpc
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/xpath-fpc
            .
      - name: Format
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      # The root workspace's crates with the fpc XPath backend on (the check job builds them without it).
      - name: Clippy (fpc backend)
        working-directory: .
        run: cargo clippy -p fmd-xpath -p fmd-lua --all-targets --features fmd-xpath/fpc,fmd-lua/xpath-fpc -- -D warnings
      - name: Test (fpc backend)
        working-directory: .
        run: cargo test -p fmd-xpath -p fmd-lua --features fmd-xpath/fpc,fmd-lua/xpath-fpc
      - name: Build libfmdxpath.so
        run: ./build.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: libfmdxpath-linux-x86_64
          path: crates/xpath-fpc/build/libfmdxpath.so
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  # The container image: compose.yaml validates, the image builds, and scripts/docker-smoke.sh
  # checks the running container (health, SPA, bundled modules, python3/node/magick).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose.yaml
        run: docker compose config -q && docker compose --env-file .env.example config -q
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fmd2r:smoke
          build-args: FMD2R_GIT_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: scripts/docker-smoke.sh fmd2r:smoke
