name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels its running checks; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # A clean debug build of every test binary needs over 16 GB with full debug info, more than a
  # runner's disk: the linker then dies with SIGBUS. Line tables keep file:line in backtraces at
  # under 5 GB; incremental artifacts are no use on a fresh runner.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml, which installs the pinned toolchain with rustfmt and clippy.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes the smoke list's offline replay (crates/fmd2r/tests/smoke.rs): every entry's
      # recorded HTTP traffic, compared with its info and pages snapshots in fixtures/smoke. The
      # crates build only the native XPath backend, the default; xpath-fpc.yml keeps the fpc
      # backend as its parity guard.
      - name: Test
        run: cargo test --workspace
      # Prints how many upstream modules pass `Init` (the test itself fails on any failure).
      - name: Module corpus
        run: cargo test -p fmd-lua --test module_corpus -- --nocapture

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
