name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A clean debug build of every test binary needs over 16 GB with full debug info, more than a
  # runner's disk: the linker then dies with SIGBUS. Line tables keep file:line in backtraces at
  # under 5 GB; incremental artifacts are no use on a fresh runner.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml, which installs the pinned toolchain with rustfmt and clippy.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes the smoke list's offline replay (crates/fmd2r/tests/smoke.rs): every entry's
      # recorded HTTP traffic, compared with its info and pages snapshots in fixtures/smoke. The
      # crates build only the native XPath backend, the default; the xpath-fpc job below keeps
      # the fpc backend as its parity guard.
      - name: Test
        run: cargo test --workspace
      # Prints how many upstream modules pass `Init` (the test itself fails on any failure).
      - name: Module corpus
        run: cargo test -p fmd-lua --test module_corpus -- --nocapture

  # crates/xpath-fpc is outside the root workspace: it needs fpc, which the check job doesn't install.
  # It is also the native backend's parity guard: both backends on the shared suites, and on the
  # differential corpus (fixtures/xpath-corpus).
  xpath-fpc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/xpath-fpc
    steps:
      - uses: actions/checkout@v4
      - name: Install FPC
        run: sudo apt-get update && sudo apt-get install -y fpc
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/xpath-fpc
            .
      - name: Format
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      # The root workspace's crates with the fpc XPath backend on (the check job builds them without it).
      - name: Clippy (fpc backend)
        working-directory: .
        run: cargo clippy -p fmd-xpath -p fmd-lua -p fmd2r --all-targets --features fmd-xpath/diff,fmd-lua/xpath-fpc,fmd2r/xpath-fpc -- -D warnings
      # `fmd-xpath/diff` runs the differential corpus on both backends (tests/corpus.rs).
      - name: Test (fpc backend)
        working-directory: .
        run: cargo test -p fmd-xpath -p fmd-lua --features fmd-xpath/diff,fmd-lua/xpath-fpc
      - name: Test fmd2r xpath (fpc backend)
        working-directory: .
        run: cargo test -p fmd2r --features xpath-fpc --test xpath
      - name: Build libfmdxpath.so
        run: ./build.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: libfmdxpath-linux-x86_64
          path: crates/xpath-fpc/build/libfmdxpath.so
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
