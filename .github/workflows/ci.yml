name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels its running checks; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # A clean debug build of every test binary needs over 16 GB with full debug info, more than a
  # runner's disk: the linker then dies with SIGBUS. Line tables keep file:line in backtraces at
  # under 5 GB; incremental artifacts are no use on a fresh runner.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup reads rust-toolchain.toml, which installs the pinned toolchain with rustfmt and clippy.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes the smoke list's offline replay (crates/fmd2r/tests/smoke.rs): every entry's
      # recorded HTTP traffic, compared with its info and pages snapshots in fixtures/smoke. The
      # crates build only the native XPath backend, the default; xpath-fpc.yml keeps the fpc
      # backend as its parity guard.
      - name: Test
        run: cargo test --workspace
      # Prints how many upstream modules pass `Init` (the test itself fails on any failure).
      - name: Module corpus
        run: cargo test -p fmd-lua --test module_corpus -- --nocapture

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  # The plan's end-to-end run (docs/plan.md, Verification) against the real composed server:
  # web/e2e-real/serve.mjs runs the debug `fmd2r serve` with a fixture module and a local image
  # site, so nothing reaches the network.
  e2e:
    runs-on: ubuntu-latest
    # The run takes a few minutes; this stops a hang well before the default 6 hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Its own cache: this job builds only the `fmd2r` binary, not the test binaries.
          key: e2e
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build fmd2r
        run: cargo build -p fmd2r
      - name: Install web dependencies
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # Builds web/ and serves it with the binary built above.
      - name: End-to-end tests
        working-directory: web
        run: npm run test:e2e:real
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-results
          path: web/test-results
          if-no-files-found: ignore
