<title>FMD2r UI Layouts</title>
<!--
  PROTOTYPE — throwaway. Answers map ticket "Prototype the web UI layout" (Thundernerd/FMD2r#13).
  Plan: three structurally different layouts of the whole FMD2r web UI (every section on the
  parity checklist), switchable via ?variant=A|B|C (or #A / #B / #C) and the floating bar at the bottom
  (← / → keys also cycle). All data is mock data held in memory; nothing persists.
    A  Workbench   – sidebar + dense multi-pane tables, closest to FMD2's mental model
    B  Library     – media-server style: cover grid home, series pages, queue in a bottom dock
    C  Command     – omnibox + "needs you" inbox home, queue always in a right rail, info in sheets
  Run: open this file in a browser.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@600;700;800&display=swap">
<style>
/* Layout: one app shell per variant over shared mock data; tokens below are shared so variants differ in structure, not paint. */
:root {
  --bg: #f3f5f6; --surface: #ffffff; --surface-2: #e9edef; --line: #d6dde0;
  --fg: #172226; --muted: #5a6a70; --accent: #0b6e7f; --accent-fg: #ffffff; --accent-soft: #d5ecef;
  --ok: #2b7a45; --warn: #a86a12; --bad: #b8352a; --idle: #7a8790;
  --ok-soft: #dcefe2; --warn-soft: #f6e9d2; --bad-soft: #f6dcd8; --idle-soft: #e6eaec;
  --shadow: 0 1px 2px rgba(15,30,35,.08), 0 6px 20px rgba(15,30,35,.08);
  --f-display: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101618; --surface: #172024; --surface-2: #1f2a2f; --line: #2b383e;
  --fg: #e3eaec; --muted: #93a3a9; --accent: #3fb3c4; --accent-fg: #06272c; --accent-soft: #163a40;
  --ok: #5cc27e; --warn: #e0a647; --bad: #f07a6e; --idle: #8c9aa0;
  --ok-soft: #1b3324; --warn-soft: #3a2c14; --bad-soft: #3d1f1c; --idle-soft: #232d31;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #101618; --surface: #172024; --surface-2: #1f2a2f; --line: #2b383e;
  --fg: #e3eaec; --muted: #93a3a9; --accent: #3fb3c4; --accent-fg: #06272c; --accent-soft: #163a40;
  --ok: #5cc27e; --warn: #e0a647; --bad: #f07a6e; --idle: #8c9aa0;
  --ok-soft: #1b3324; --warn-soft: #3a2c14; --bad-soft: #3d1f1c; --idle-soft: #232d31;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--f-body); }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
.mono { font-family: var(--f-mono); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; }

/* shared leaf widgets */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 5px 10px; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { padding: 2px 7px; font-size: 12px; }
.input { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 5px 9px; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.st-downloading { background: var(--accent-soft); color: var(--accent); }
.st-queued, .st-stopped, .st-disabled { background: var(--idle-soft); color: var(--idle); }
.st-failed { background: var(--bad-soft); color: var(--bad); }
.st-completed { background: var(--ok-soft); color: var(--ok); }
.st-new { background: var(--warn-soft); color: var(--warn); }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; min-width: 60px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .6s; }
.bar.failed i { background: var(--bad); } .bar.completed i { background: var(--ok); }
.cover { flex: none; display: flex; align-items: flex-end; justify-content: flex-start; padding: 6px; border-radius: 4px; color: #fff; font: 700 13px/1.1 var(--f-display);
  background: linear-gradient(160deg, hsl(var(--h) 45% 52%), hsl(calc(var(--h) + 40) 50% 28%)); text-shadow: 0 1px 2px rgba(0,0,0,.4); overflow: hidden; }
.cover.xs { width: 28px; height: 40px; font-size: 9px; padding: 3px; }
.cover.sm { width: 44px; height: 62px; font-size: 10px; }
.cover.md { width: 120px; height: 170px; }
.cover.lg { width: 180px; height: 255px; font-size: 18px; }
.cover.fill { width: 100%; aspect-ratio: 5/7; height: auto; max-width: 100%; }
.tbl-wrap { overflow-x: auto; min-width: 0; }
table.tbl { border-collapse: collapse; width: 100%; font-size: 13px; }
.tbl th { text-align: left; font-weight: 600; font-size: 11.5px; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
.tbl td { padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl tr.sel td { background: var(--accent-soft); }
.tbl tbody tr:hover td { background: var(--surface-2); cursor: default; }
.tbl tr.sel:hover td { background: var(--accent-soft); }
.chk { width: 15px; height: 15px; accent-color: var(--accent); }
.tri { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 12px; background: var(--surface); }
.tri.inc { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.tri.exc { background: var(--bad-soft); color: var(--bad); border-color: transparent; text-decoration: line-through; }
.chap { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-bottom: 1px solid var(--line); font-size: 13px; }
.chap.dl { color: var(--muted); }
.chap.dl .chap-t::after { content: " ✓ downloaded"; color: var(--ok); font-size: 11px; }
.field { display: flex; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.field .f-l { flex: 1 1 220px; min-width: 0; }
.field .f-hint { font-size: 12px; color: var(--muted); }
.toggle { appearance: none; width: 34px; height: 19px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; flex: none; transition: background .15s; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: var(--surface); transition: left .15s; }
.toggle:checked { background: var(--accent); } .toggle:checked::after { left: 17px; }
.log { font-family: var(--f-mono); font-size: 12px; display: flex; gap: 10px; padding: 3px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.log .lv-WARN { color: var(--warn); } .log .lv-ERROR { color: var(--bad); } .log .lv-INFO { color: var(--accent); } .log .lv-DEBUG { color: var(--idle); }
.graph svg { display: block; width: 100%; height: 100%; }
.fog { border: 1px dashed var(--warn); background: var(--warn-soft); color: var(--warn); border-radius: var(--r); padding: 8px 10px; font-size: 12.5px; }
.toast { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: var(--r); box-shadow: var(--shadow); z-index: 60; font-size: 13px; }
.job { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }

/* prototype switcher – deliberately not part of the design */
.pswitch { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 100;
  display: flex; align-items: center; gap: 4px; background: #111; color: #fff; border-radius: 999px; padding: 4px; box-shadow: 0 4px 18px rgba(0,0,0,.45); font: 600 13px/1 var(--f-mono); border: 2px solid #ffd400; }
.pswitch button { background: #2a2a2a; color: #fff; border: 0; border-radius: 999px; width: 30px; height: 30px; font-size: 15px; }
.pswitch span { padding: 0 12px; white-space: nowrap; }

/* ============ VARIANT A: Workbench ============ */
.vA { display: flex; height: 100%; }
.a-nav { width: 200px; flex: none; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 10px; gap: 2px; }
.a-brand { font: 800 18px var(--f-display); padding: 0 8px 14px; letter-spacing: -.01em; }
.a-brand small { font: 500 11px var(--f-mono); color: var(--muted); margin-left: 4px; }
.a-nav button { display: flex; justify-content: space-between; align-items: center; text-align: left; border: 0; background: transparent; padding: 7px 10px; border-radius: var(--r); font-weight: 500; }
.a-nav button:hover { background: var(--surface-2); }
.a-nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.a-nav .cnt { font: 500 11px var(--f-mono); color: var(--muted); }
.a-nav .cnt.hot { background: var(--warn); color: var(--surface); border-radius: 999px; padding: 1px 6px; }
.a-jobs { margin-top: auto; border-top: 1px solid var(--line); padding: 10px 8px 60px; display: flex; flex-direction: column; gap: 10px; }
.a-main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.a-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.a-head h1 { font-size: 18px; margin-right: auto; }
.a-body { flex: 1; min-height: 0; overflow: auto; }
.a-dl { display: flex; height: 100%; min-height: 0; }
.a-tree { width: 190px; flex: none; border-right: 1px solid var(--line); padding: 10px; overflow: auto; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.a-tree button { text-align: left; border: 0; background: transparent; padding: 4px 8px; border-radius: 4px; display: flex; justify-content: space-between; }
.a-tree button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.a-tree .label { padding: 10px 8px 4px; }
.a-dlmain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.a-tools { display: flex; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
.a-dlmain .tbl-wrap { flex: 1; overflow: auto; }
.a-graph { height: 84px; border-top: 1px solid var(--line); padding: 6px 10px; display: flex; gap: 12px; align-items: stretch; }
.a-graph .graph { flex: 1; min-width: 0; }
.a-detail { width: 280px; flex: none; border-left: 1px solid var(--line); background: var(--surface); padding: 14px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.a-detail dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; font-size: 12.5px; }
.a-detail dt { color: var(--muted); } .a-detail dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.a-browse { display: flex; height: 100%; min-height: 0; }
.a-list { width: 290px; flex: none; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.a-list .a-listbody { flex: 1; overflow: auto; }
.a-li { display: flex; gap: 8px; align-items: center; padding: 4px 10px; font-size: 13px; border-bottom: 1px solid var(--line); cursor: pointer; }
.a-li:hover { background: var(--surface-2); } .a-li.on { background: var(--accent-soft); }
.a-li .new { color: var(--warn); font-size: 11px; font-weight: 600; }
.a-info { flex: 1; min-width: 0; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.a-chap { width: 360px; flex: none; border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
.a-chap .a-chaplist { flex: 1; overflow: auto; }
.a-dlbox { border-top: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.a-tabs { display: flex; border-bottom: 1px solid var(--line); }
.a-tabs button { border: 0; background: transparent; padding: 8px 12px; border-bottom: 2px solid transparent; font-weight: 500; }
.a-tabs button.on { border-bottom-color: var(--accent); color: var(--accent); }
.a-settings { display: flex; height: 100%; min-height: 0; }
.a-subnav { width: 190px; flex: none; border-right: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.a-subnav button { text-align: left; border: 0; background: transparent; padding: 6px 10px; border-radius: 4px; }
.a-subnav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.a-form { flex: 1; min-width: 0; overflow: auto; padding: 8px 20px 80px; max-width: 860px; }
.a-form h3 { font-size: 14px; margin: 18px 0 2px; }
.a-pad { padding: 14px 16px 80px; display: flex; flex-direction: column; gap: 10px; }
.a-inbox { display: flex; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: var(--r); align-items: flex-start; flex-wrap: wrap; }
@media (max-width: 1100px) { .a-chap { width: 300px; } .a-detail { width: 240px; } }
@media (max-width: 860px) {
  .vA { flex-direction: column; height: auto; }
  .a-nav { width: auto; flex-direction: row; overflow-x: auto; padding: 8px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
  .a-brand { padding: 6px 8px; } .a-jobs { display: none; }
  .a-dl, .a-browse, .a-settings { flex-direction: column; height: auto; }
  .a-tree, .a-list, .a-chap, .a-detail, .a-subnav { width: auto; border: 0; border-bottom: 1px solid var(--line); }
  .a-tree, .a-subnav { flex-direction: row; flex-wrap: wrap; }
  .a-list .a-listbody, .a-chap .a-chaplist { max-height: 320px; }
  .a-head, .a-tools, .a-pad, .a-form, .a-info { padding-left: 16px; padding-right: 16px; }
}

/* ============ VARIANT B: Library ============ */
.vB { min-height: 100%; padding-bottom: 130px; }
.b-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 18px; padding: 10px 24px; flex-wrap: wrap; }
.b-brand { font: 800 20px var(--f-display); letter-spacing: -.02em; }
.b-nav { display: flex; gap: 2px; flex-wrap: wrap; }
.b-nav button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-weight: 500; }
.b-nav button.on { background: var(--fg); color: var(--bg); }
.b-add { flex: 1; display: flex; gap: 6px; min-width: 200px; max-width: 460px; margin-left: auto; }
.b-add .input { flex: 1; }
.b-bell { position: relative; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; }
.b-bell b { position: absolute; top: -5px; right: -5px; background: var(--warn); color: var(--surface); border-radius: 999px; font-size: 10.5px; padding: 1px 6px; }
.b-pop { position: absolute; right: 24px; top: 58px; width: min(420px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); z-index: 30; padding: 6px; }
.b-pop .b-pi { padding: 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.b-pop .b-pi:last-child { border-bottom: 0; }
.b-page { max-width: 1280px; margin: 0 auto; padding: 22px 24px; display: flex; flex-direction: column; gap: 18px; }
.b-page > h1 { font-size: 30px; letter-spacing: -.02em; }
.b-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.b-chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.b-chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.b-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px 16px; }
.b-card { display: flex; flex-direction: column; gap: 6px; cursor: pointer; position: relative; border: 0; background: transparent; text-align: left; padding: 0; }
.b-card .t { font-weight: 600; font-size: 13.5px; line-height: 1.25; }
.b-card .badge { position: absolute; top: 6px; right: 6px; }
.b-card.off { opacity: .45; }
.b-card:hover .cover { outline: 2px solid var(--accent); outline-offset: 2px; }
.b-hero { display: flex; gap: 28px; flex-wrap: wrap; }
.b-hero .meta { flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.b-hero h1 { font-size: 34px; letter-spacing: -.02em; }
.b-kv { display: flex; gap: 22px; flex-wrap: wrap; font-size: 13px; }
.b-kv div { display: flex; flex-direction: column; }
.b-section { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.b-section > header { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.b-section > header h2 { font-size: 16px; margin-right: auto; }
.b-chapgrid { max-height: 420px; overflow: auto; }
.b-discover { display: flex; gap: 22px; align-items: flex-start; }
.b-facets { width: 250px; flex: none; position: sticky; top: 76px; display: flex; flex-direction: column; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.b-results { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.b-qgroup h2 { font-size: 15px; margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
.b-qrow { display: flex; gap: 12px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.b-qrow:last-child { border-bottom: 0; }
.b-qrow .bar { flex: 1 1 140px; }
.b-dock { position: fixed; left: 16px; right: 16px; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; max-width: 900px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); z-index: 25; padding: 10px 14px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.b-dock .graph { width: 140px; height: 34px; }
.b-settings { display: flex; gap: 28px; align-items: flex-start; }
.b-toc { width: 180px; flex: none; position: sticky; top: 76px; display: flex; flex-direction: column; gap: 2px; }
.b-toc a { color: var(--muted); text-decoration: none; padding: 4px 10px; border-left: 2px solid var(--line); font-size: 13px; }
.b-toc a:hover { color: var(--accent); border-left-color: var(--accent); }
.b-setbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.b-setbody .b-section > div { padding: 0 14px; }
.b-jobstrip { display: flex; gap: 18px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; align-items: center; }
@media (max-width: 860px) {
  .b-top, .b-page { padding-left: 16px; padding-right: 16px; }
  .b-discover, .b-settings { flex-direction: column; align-items: stretch; }
  .b-facets, .b-toc { width: auto; position: static; }
  .b-toc { flex-direction: row; flex-wrap: wrap; }
  .b-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
  .b-dock .graph { display: none; }
}

/* ============ VARIANT C: Command ============ */
.vC { height: 100%; display: flex; flex-direction: column; }
.c-bar { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--fg); color: var(--bg); position: relative; z-index: 30; flex-wrap: wrap; }
.c-mark { font: 800 17px var(--f-display); letter-spacing: -.01em; white-space: nowrap; }
.c-omni { flex: 1; position: relative; min-width: 220px; max-width: 720px; margin: 0 auto; }
.c-omni input { width: 100%; border: 0; border-radius: 8px; padding: 9px 14px 9px 34px; background: var(--surface); color: var(--fg); font-size: 14px; }
.c-omni::before { content: "⌕"; position: absolute; left: 12px; top: 6px; color: var(--muted); font-size: 18px; z-index: 1; }
.c-omni kbd { position: absolute; right: 10px; top: 9px; font: 11px var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
.c-drop { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; display: flex; flex-direction: column; }
.c-drop .label { padding: 6px 8px 2px; }
.c-drop button { display: flex; gap: 10px; align-items: center; border: 0; background: transparent; text-align: left; padding: 6px 8px; border-radius: 6px; }

const graph = () => { const max = 5; const pts = S.rates.map((r, i) => `${(i / 59 * 100).toFixed(2)},${(40 - r / max * 38).toFixed(2)}`).join(' ');

    const ts = TASKS.filter(t => manga(t.m).t.toLowerCase().includes(S.dlQ.toLowerCase()));
    const order = ['downloading', 'queued', 'failed', 'stopped', 'disabled', 'completed'];
    const groups = S.qHist ? HIST.slice(1, 6).map(([k, l]) => [l, ts.filter(t => t.hist === k)]) : [['Now', ts.filter(t => t.st === 'downloading' || t.st === 'queued')], ['Needs attention', ts.filter(t => t.st === 'failed' || t.st === 'stopped' || t.st === 'disabled')], ['Done', ts.filter(t => t.st === 'completed')]];
    return `<aside class="c-queue" aria-label="Download queue"><div class="c-qhead"><div class="row"><b class="grow" style="font:700 15px var(--f-display)">Queue</b><b class="mono num" data-total>${totalRate().toFixed(1)} MB/s</b></div><div class="graph">${graph()}</div>
      <div class="row"><button class="btn sm" data-act="resumeAll">▶ All</button><button class="btn sm" data-act="stopAll">■ All</button><button class="btn sm" data-act="clearDone">Clear done</button><span class="grow"></span><button class="btn sm ${S.qHist ? 'primary' : ''}" data-act="qHist" title="Group by date added">By date</button></div>
      <input class="input" placeholder="Search queue" id="dlQ" data-bind="dlQ" value="${h(S.dlQ)}"></div>
      <div class="c-qlist">${groups.filter(g => g[1].length).map(([l, g]) => `<div class="c-group">${l}</div>${g.sort((a, b) => order.indexOf(a.st) - order.indexOf(b.st)).map(t => `<div class="c-qi ${S.qOpen === t.id ? 'open' : ''}" data-act="qOpen" data-id="${t.id}"><div class="row" style="flex-wrap:nowrap"><span class="t grow">${h(manga(t.m).t)}</span>${pill(t.st)}</div><div class="row small muted" style="flex-wrap:nowrap"><span class="grow">${t.ch} · ${site(manga(t.m).s).name}</span>${progTxt(t)}</div>${prog(t)}
        ${S.qOpen === t.id ? `${t.err ? `<div class="small" style="color:var(--bad)">${h(t.err)}</div>` : ''}<div class="small mono muted">${h(saveTo(t))} · added ${t.added}</div><div class="row"><button class="btn sm">Pause</button><button class="btn sm">Resume</button><button class="btn sm">Redownload</button><button class="btn sm" title="Move to top">⤒</button><button class="btn sm" title="Up">↑</button><button class="btn sm" title="Down">↓</button><button class="btn sm" data-open="${t.m}">Info</button><button class="btn sm" data-act="toast" data-msg="Preparing files">Files</button><select class="input" style="padding:2px 4px;font-size:12px" aria-label="More"><option>More…</option><option>Enable</option><option>Disable</option><option>Merge completed</option><option>Delete task</option><option>Delete task + files</option><option>Delete task + files + favorite</option></select></div>` : ''}</div>`).join('')}`).join('')}</div></aside>`;
  },
  sheet() {
    const m = manga(S.manga);
    return `<section class="c-sheet" role="dialog" aria-label="${h(m.t)}"><header><h2>${h(m.t)}</h2><button class="btn" data-act="fav">☆ Favorite</button><button class="btn" data-act="closeSheet" aria-label="Close">✕</button></header>
      <div class="c-sbody"><div class="row" style="align-items:flex-start;flex-wrap:nowrap">${cover(m, 'md')}<div class="stack grow">${metaDl(m)}<p style="margin:0" class="small">${h(m.sum)}</p></div></div>
      <div class="c-card" style="padding:0"><div style="padding:10px 12px;border-bottom:1px solid var(--line)">${chapTools(m)}</div><div style="max-height:340px;overflow:auto">${chapList(m)}</div><div class="stack" style="padding:10px 12px;border-top:1px solid var(--line)">${dlBox(m)}</div></div></div></section>`;
  },
  settingsModal() {
    const q = S.setQ.trim().toLowerCase();
    const secs = SETTINGS.filter(s => s.id !== 'logs');
    return `<section class="c-modal" role="dialog" aria-label="Settings"><header><b style="font:700 16px var(--f-display)">Settings</b><input class="input grow" placeholder="Find a setting (try “proxy” or “cbz”)" id="setQ" data-bind="setQ" value="${h(S.setQ)}"><button class="btn" data-act="closeSet" aria-label="Close">✕</button></header>
      <div class="c-mbody">${secs.map(s => { if (s.special) { if (q && !s.name.toLowerCase().includes(q) && !(s.id === 'web' && 'website account module cloudflare update list'.includes(q))) return ''; return `<h3>${s.name}</h3>${specialHtml(s.special)}`; }
        const fs = s.groups.flatMap(g => g.f.map(f => [g.name, f])).filter(([g, f]) => !q || (f[0] + ' ' + g + ' ' + s.name + ' ' + f.slice(2).join(' ')).toLowerCase().includes(q));
        return fs.length ? `<h3>${s.name}</h3>${fs.map(([, f]) => fieldHtml(f)).join('')}` : ''; }).join('') || '<p class="muted">No setting matches that.</p>'}</div></section>`;
  },
};

const IMPL = { A, B, C };

// ---------------- wiring ----------------
const app = document.getElementById('app');
function render() {
  const ae = document.activeElement, id = ae && ae.id, pos = ae && 'selectionStart' in ae ? ae.selectionStart : null;
  app.innerHTML = IMPL[S.v].render();
  document.getElementById('pLabel').textContent = `${S.v} (${VNAME[S.v]})`;
  document.title = `FMD2r UI Layouts`;
  if (id) { const el = document.getElementById(id); if (el) { el.focus(); try { if (pos != null) el.setSelectionRange(pos, pos); } catch (e) {} } }
}
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2400); }
function setVariant(v, push = true) {
  S.v = v; S.sheet = false; S.settings = false; S.bell = false;
  if (v === 'C' && !['home', 'favorites', 'browse', 'logs'].includes(S.page)) S.page = 'home';
  if (v !== 'C' && S.page === 'home') S.page = 'downloads';
  if (push) { try { const u = new URL(location.href); u.searchParams.set('variant', v); u.hash = v; history.replaceState(null, '', u); } catch (e) { location.hash = v; } }
  render();
}
const ACT = {
  dlSt: d => S.dlSt = d.k, dlHist: d => S.dlHist = d.k, selTask: d => S.task = +d.id, favF: d => S.favF = d.k, setSec: d => S.setSec = d.k, bTab: d => S.browseTab = d.k, bSys: d => S.bTab = d.k,
  tri: d => { const v = S.tri[d.g] || 0; const n = v === 0 ? 1 : v === 1 ? -1 : 0; if (n) S.tri[d.g] = n; else delete S.tri[d.g]; },
  tri0: d => delete S.tri[d.g], clearTri: () => S.tri = {}, allSites: () => S.site = S.site === 'all' ? 'mangadex' : 'all',
  chk: (d, el) => { el.checked ? S.checked.add(+d.no) : S.checked.delete(+d.no); return 'soft'; },
  chkAll: () => chapters(manga(S.manga)).forEach(c => S.checked.add(c.no)), chkNone: () => S.checked.clear(),
  chkNew: () => { S.checked.clear(); chapters(manga(S.manga)).filter(c => !c.dl).forEach(c => S.checked.add(c.no)); },
  download: () => { toast(`Queued ${S.checked.size || 'all'} chapters of ${manga(S.manga).t}`); S.checked.clear(); },
  fav: () => toast('Added to favorites'), paste: () => { S.manga = 'kagura'; openManga(); toast('Resolved URL with the ComicK module'); },
  resumeAll: () => toast('Resumed all downloads'), stopAll: () => toast('Paused all downloads'),
  clearDone: () => toast('Deleted completed tasks'), move: d => toast('Moved ' + d.d), cancelJob: d => toast('Cancelled'),
  inbox: (d, el) => { S.inbox = S.inbox.filter(x => x !== d.id); toast(el.textContent + ' ✓'); },
  bell: () => S.bell = !S.bell, closeSheet: () => S.sheet = false, openSet: () => { S.settings = true; S.omni = ''; }, closeSet: () => S.settings = false,
  qOpen: d => S.qOpen = S.qOpen === +d.id ? null : +d.id, qHist: () => S.qHist = !S.qHist, logLv: d => S.logLv = d.lv,
  toast: d => { toast(d.msg); return 'soft'; }, noop: () => 'soft',
};
function openManga() { S.checked.clear(); if (S.v === 'C') { S.sheet = true; S.omni = ''; } else S.page = S.v === 'A' ? 'browse' : 'info'; S.bell = false; }
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]'), op = e.target.closest('[data-open]'), act = e.target.closest('[data-act]');
  if (act && act.tagName === 'SELECT') return;
  if (op && (!act || op.contains(act) === false || act === op)) { S.manga = op.dataset.open; openManga(); render(); return; }
  if (go) { S.page = go.dataset.go; S.bell = false; S.sheet = false; render(); window.scrollTo(0, 0); return; }
  if (act && ACT[act.dataset.act]) { const r = ACT[act.dataset.act](act.dataset, act); if (r !== 'soft') render(); }
});
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.bind; if (k) { S[k] = e.target.value; render(); } });
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (e.key === 'Escape') { S.sheet = false; S.settings = false; S.bell = false; S.omni = ''; render(); return; }
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) {
    if (e.key === 'Enter' && e.target.id === 'omni') { const b = document.querySelector('.c-drop .hl, .c-drop button'); if (b) b.click(); }
    return;
  }
  if (e.key === '/' && S.v === 'C') { e.preventDefault(); document.getElementById('omni')?.focus(); return; }
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const i = VARIANTS.indexOf(S.v); setVariant(VARIANTS[(i + (e.key === 'ArrowRight' ? 1 : VARIANTS.length - 1)) % VARIANTS.length]); }
});
document.getElementById('pPrev').onclick = () => setVariant(VARIANTS[(VARIANTS.indexOf(S.v) + VARIANTS.length - 1) % VARIANTS.length]);
document.getElementById('pNext').onclick = () => setVariant(VARIANTS[(VARIANTS.indexOf(S.v) + 1) % VARIANTS.length]);
window.addEventListener('hashchange', () => { const v = location.hash.slice(1).toUpperCase(); if (VARIANTS.includes(v) && v !== S.v) setVariant(v, false); });

// live progress without re-rendering
setInterval(() => {
  TASKS.filter(t => t.st === 'downloading').forEach(t => {
    t.rate = Math.max(.3, t.rate + (Math.random() - .5) * .6); t.done = Math.min(t.tot, t.done + 1);
    if (t.done === t.tot) { t.st = 'completed'; t.last = '2026-10-08 09:4' + (t.id % 10); const q = TASKS.find(x => x.st === 'queued'); if (q) q.st = 'downloading', q.rate = 1.5; render(); return; }
    document.querySelectorAll(`[data-prog="${t.id}"]`).forEach(el => el.style.width = pct(t) + '%');
    document.querySelectorAll(`[data-progt="${t.id}"]`).forEach(el => el.textContent = `${t.done}/${t.tot}`);
    document.querySelectorAll(`[data-rate="${t.id}"]`).forEach(el => el.textContent = t.rate.toFixed(1) + ' MB/s');
  });
  S.rates.shift(); S.rates.push(totalRate());
  document.querySelectorAll('[data-total]').forEach(el => el.textContent = totalRate().toFixed(1) + ' MB/s');
  document.querySelectorAll('.graph').forEach(el => el.innerHTML = graph());
}, 1000);

// boot
(() => { let v = null; try { v = new URL(location.href).searchParams.get('variant'); } catch (e) {} v = (v || location.hash.slice(1) || 'A').toUpperCase(); setVariant(VARIANTS.includes(v) ? v : 'A', false); })();
</script>
