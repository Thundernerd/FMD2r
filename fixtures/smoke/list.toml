# The smoke list: representative upstream modules whose `module info` and `module pages` runs
# are recorded (fixtures/smoke/<name>/), replayed offline in CI and run live every night.
# See fixtures/README.md; re-record an entry with scripts/smoke-record.sh <name>.
#
# Coverage (each entry's `notes` say what it covers):
# - Templates: Madara (3asq-dig-it, mangaread-a-i-doctor, manhuaplus-catastrophic),
#   MangaThemesia (thunderscans-barbarian, rizzcomics-absolute-dominion), WPComics (xoxocomics,
#   manhuaplus-top), HeanCMS (omegascans), GroupLe (selfmanga), FoOlSlide (deathtollscans,
#   seinagi-online), Liliana (manhuaplus-org), KeyoApp (genztoons-dragon-kunlun), Guya (guya-moe),
#   LibGroup (mangalib).
# - JSON APIs: mangadex, mangaplus, mangaball, olympus-scans, voratoon, guya-moe, mangalib, webtoons.
# - Libraries: fmd.crypto (mangadex, mangaplus, webtoons, mangaball, philia-scans, voratoon,
#   olympus-scans, e-hentai), fmd.duktape (fanfox), fmd.imagepuzzle (nexus-scanlation,
#   philia-scans), pb (mangaplus).
# - Cookies (webtoons, fanfox, e-hentai), account support (selfmanga, e-hentai; both run logged
#   out), DynamicPageLink (e-hentai).
#
# Not covered, for want of a live site when the list was recorded (2026-10): MangaReaderOnline,
# FMReader, MangaBox, Genkan and NineManga (sites dead, parked or behind Cloudflare challenges),
# MadTheme (TooniTube's chapter API now redirects to another host), MangaHub (its API host is
# down). Modules that run node (utils.nodejs, e.g. Comix) can't be replayed: node fetches pages
# itself, past the recorded HTTP.

