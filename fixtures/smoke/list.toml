# The smoke list: representative upstream modules whose `module info` and `module pages` runs
# are recorded (fixtures/smoke/<name>/), replayed offline in CI and run live every night.
# See fixtures/README.md; re-record an entry with scripts/smoke-record.sh <name>.
#
# Coverage (each entry's `notes` say what it covers):
# - Templates: Madara (3asq-dig-it, mangaread-a-i-doctor, manhuaplus-catastrophic),
#   MangaThemesia (thunderscans-barbarian, rizzcomics-absolute-dominion), WPComics (xoxocomics,
#   manhuaplus-top), HeanCMS (omegascans), GroupLe (selfmanga), FoOlSlide (deathtollscans,
#   seinagi-online), Liliana (manhuaplus-org), KeyoApp (genztoons-dragon-kunlun), Guya (guya-moe),
#   LibGroup (mangalib), FMReader (love4u).
# - JSON APIs: mangadex, mangaplus, mangaball, olympus-scans, voratoon, guya-moe, mangalib, webtoons.
# - Libraries: fmd.crypto (mangadex, mangaplus, webtoons, mangaball, philia-scans, voratoon,
#   olympus-scans, e-hentai), fmd.duktape (fanfox), fmd.imagepuzzle (nexus-scanlation,
#   philia-scans), pb (mangaplus).
# - Cookies (webtoons, fanfox, e-hentai), account support (selfmanga, e-hentai; both run logged
#   out), DynamicPageLink (e-hentai).
# - Node (utils.nodejs: comix): the processes fmd.subprocess runs are recorded with the HTTP
#   (subprocess.json, docs/fixtures.md) and replayed, so node itself never runs offline.
#
# Templates not covered, checked again 2026-10-09 (T42); all upstream, none an FMD2r difference:
# - MangaReaderOnline: the only live module, SubManhwa, overrides GetInfo with XPaths the
#   redesigned site no longer matches (no title), so it fails the live check; the modules using
#   the template's GetInfo (KomikGue, JapitComics, FallenAngelsScans) are parked or taken over,
#   the rest dead or behind Cloudflare challenges (MangaZuki, MangAs, Manga18Us, KomikManga).
# - MangaBox: MangaNato and MangaKakalot answer every HTML page with a Cloudflare challenge
#   (403 "Just a moment..."); only their chapter API is reachable.
# - Genkan: all nine hosts are dead, parked or redirect to unrelated sites.
# - NineManga: the <lang>.ninemanga.com hosts don't resolve; www.ninemanga.com is a Cloudflare
#   block page (manga pages 530, origin DNS error).
# - MadTheme: TooniTube and BeeHentai redirect, whole site, to toontop.io, a different platform
#   (no MadTheme markup or chapter API); MGJinx and KaliScan are dead. FMD2r follows the 301 to
#   the new host as FMD2 does (baseunits/httpsendthread.pas:640-668): the module, not the
#   redirect, is out of date.
# - MangaHub: every mirror goes through api.mghcdn.com, which answers with a Cloudflare
#   challenge. (The template's GetPageNumber also needs a numeric fmd.env.Revision of at least
#   6920, templates/MangaHub.lua:122, which FMD2r sets since T52.)
# - FMReader is covered for GetInfo only: every live module (Love4u, RawINU, MangaGun, WeLoMa)
#   overrides GetPageNumber.
#
# Module issues seen while recording:
# - MangaFire's GetPageNumber builds its API path from MODULE.Storage['listtype'], which only
#   its GetInfo sets, so `module pages` on its own resolves no pages. FMD2 behaves the same:
#   Storage is per module and in memory only (baseunits/lua/LuaWebsiteModules.pas:741), and a
#   download task runs OnTaskStart, OnGetPageNumber and OnGetImageURL but never OnGetInfo
#   (baseunits/uDownloadsManager.pas:1104-1330). Its downloads work only after the manga's info
#   was loaded in the same session, and fail after a restart resumes the task: upstream.

