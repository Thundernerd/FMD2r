<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- Installing to a phone's home screen (issue #311): the manifest, the iOS icon and name, and
		     the status bar colours, which follow the default theme's `--bg` (src/lib/styles/tokens.css). -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="FMD2r" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f5f6" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101618" />
		<title>FMD2r</title>
		<script>
			// The appearance last applied (`adoptAppearance` in src/lib/appearance.ts, which writes this
			// cache; keep the two in step), before the first paint: the settings
			// only answer after the page renders, which would flash the default look first.
			try {
				const cached = JSON.parse(localStorage.getItem('fmd2r.appearance') || 'null');
				if (cached) {
					const root = document.documentElement;
					if (typeof cached.style === 'string') root.dataset.style = cached.style;
					if (cached.theme === 'light' || cached.theme === 'dark')
						root.dataset.theme = cached.theme;
					if (typeof cached.accent === 'string') root.dataset.accent = cached.accent;
					if (typeof cached.scale === 'string')
						root.style.setProperty('--text-scale', cached.scale);
				}
			} catch {
				// Blocked storage or a damaged entry: the default look until the settings answer.
			}
		</script>
		%sveltekit.head%
		<!-- The user's own styles from the data folder (fmd-server serves it, empty when there's
		     none); last, so it wins over the app's at equal specificity. -->
		<link rel="stylesheet" href="/custom.css" />
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
